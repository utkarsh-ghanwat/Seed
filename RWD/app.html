<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>

    <style>
        body {
            background-color: yellow;
            margin: 0;
            padding: 40px;
        }

        form {
            width: 700px;
            margin: auto;
            background-color: #222;
            padding: 30px;
            color: white;
        }

        table {
            width: 100%;
            border-spacing: 10px;
        }

        th {
            font-size: 28px;
            padding-bottom: 20px;
        }

        td {
            vertical-align: top;
        }

        input,
        select {
            width: 100%;
            height: 40px;
            box-sizing: border-box;
            padding: 8px;
        }

        p {
            margin: 5px 0 0;
        }

        button {
            background-color: red;
            color: white;
            border: none;
            padding: 12px 50px;
            border-radius: 20px;
        }
    </style>
</head>

<body>

    <form>

        <table>

            <tr>
                <th colspan="2">
                    Request a free trial
                </th>
            </tr>

            <!-- Name -->
            <tr>
                <td>
                    Name<br>
                    <input type="text" placeholder="Enter your name">
                    <p>First</p>
                </td>

                <td>
                    <br>
                    <input type="text" placeholder="Enter your name">
                    <p>Last</p>
                </td>
            </tr>

            <!-- Email -->
            <tr>
                <td colspan="2">
                    Email<br>
                    <input type="email" placeholder="Enter your email">
                </td>
            </tr>

            <!-- Company Name -->
            <tr>
                <td colspan="2">
                    Company Name<br>
                    <input type="text" placeholder="Enter your Company name">
                </td>
            </tr>

            <!-- Company Address -->
            <tr>
                <td colspan="2">
                    Company Address<br>
                    <input type="text" placeholder="Enter your Company address">
                </td>
            </tr>

            <!-- Street Address -->
            <tr>
                <td colspan="2">
                    Street Address<br>
                    <input type="text" placeholder="Enter your Street address">
                </td>
            </tr>

            <!-- City and State -->
            <tr>
                <td>
                    Address Line 2<br>
                    <input type="text" placeholder="Enter your city">
                    <p>City</p>
                </td>

                <td>
                    <br>
                    <select>
                        <option>Select State/Province</option>
                        <option>State 1</option>
                        <option>State 2</option>
                    </select>
                    <p>State/Province</p>
                </td>
            </tr>

            <!-- Postal and Country -->
            <tr>
                <td>
                    Postal / Zip Code<br>
                    <input type="text" placeholder="Enter postal code">
                </td>

                <td>
                    Country<br>
                    <select>
                        <option>Select Country</option>
                        <option>India</option>
                        <option>USA</option>
                        <option>UK</option>
                    </select>
                </td>
            </tr>

            <!-- Submit -->
            <tr>
                <td colspan="2" style="text-align: center;">
                    <button type="submit">Submit</button>
                </td>
            </tr>

        </table>

    </form>

</body>

</html>
