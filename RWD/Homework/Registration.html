<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: white;
        }

        form {
            background: white;
            padding: 25px;
            border-radius: 10px;
            width: 300px;
        }

        label {
            display: block;
            margin: 10px 0 5px;
        }

        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            margin-bottom: 10px;
        }

        button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 5px;
            background: #0077cc;
            color: white;
            
        }
    </style>
</head>

<body>
    <div>
        <form action="/Success.html">
            <label>First Name</label>
            <input type="text" placeholder="enter your name"><br>

            <label>Last Name</label>
            <input type="text" placeholder="enter your last name"><br>

            <label>User Name</label>
            <input type="text" placeholder="enter your user name"><br>

            <label>Password</label>
            <input type="password" placeholder="enter your password"><br>

            <button type="submit">Register</button>
        </form>
    </div>
</body>

</html>
