<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function Add(){
            var a = Number(prompt("Enter a no A"));
            var b = Number(prompt("Enter a no A"));     // Instead of Number we can use parseInt i.e. c = parseInt(a)+parseInt(b);

            c = a+b;
            alert("Sum is:"+c);

        }
    </script>
</head>
<body>
    <input type="button" onclick="Add()" value="Addition" >
</body>
</html>
